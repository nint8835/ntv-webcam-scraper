[project]
name = "ntv-webcam-scraper"
version = "0.1.0"
description = "Simple tool to take snapshots of all of NTV's live webcams on a set interval"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.1",
    "asyncstdlib==3.14.0",
    "fastapi==0.165.0",
    "ffmpeg-python==0.2.0",
    "httpx==0.28.1",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "scheduler==0.8.11",
    "sqlalchemy[asyncio]==2.1.9",
    "typer==0.29.2",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["ruff==0.17.6"]

[tool.ruff]
target-version = "py315"
